[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wpsd-wifi-manager"
version = "0.1.0"
description = "NetworkManager-based Wi-Fi profile manager and failover watchdog for WPSD hotspots."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
license-files = ["LICENSE.md"]
authors = [
    { name = "LZARC" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
wpsd-wifi-manager = "wpsd_wifi_manager.cli:main"
wpsd-wifi-manager-admin = "wpsd_wifi_manager.admin:main"
wpsd-wifi-helper = "wpsd_wifi_manager.helper:main"
wpsd-wifi-watchdog = "wpsd_wifi_manager.watchdog:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
